name: Release

# 推 v* 标签触发（v1.2.3 / v0.2.1 ...）
# 工作流：装依赖 → 类型检查 → build renderer + main → electron-builder 跑 NSIS + portable → 上传到 GitHub Release
#
# 用法（本地）：
#   pnpm version patch   # bump package.json version
#   git add -A && git commit -m "release: vX.Y.Z"
#   git tag vX.Y.Z
#   git push origin main --tags
# → CI 触发本工作流，跑完自动创建 GitHub Release 并附上 .exe 资产

on:
  push:
    tags:
      - 'v*'
  # 手动触发（Actions 页面 → Run workflow），方便 CI 失败时重跑而不用删 tag
  # version 必填，例 v0.2.1（**保留 v 前缀** → release tag 也用这个）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必填，含 v 前缀，如 v0.2.1）'
        required: true
        type: string

# 写 asset 需要 contents: write
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS Krypton)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 不要 cache pnpm（让 setup-node 的 post-action 找不到 pnpm 而报错）
          # 直接不设 cache，让 GitHub 完全不自动 cache
          # 同时 cache-dependency-path 指向不存在的路径，让任何自动嗅探 noop
          cache: 'npm'
          cache-dependency-path: '__no_cache__.json'

      - name: Install pnpm globally
        shell: pwsh
        run: npm install -g pnpm@10

      - name: Verify pnpm
        shell: pwsh
        run: pnpm --version

      - name: Install dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile || pnpm install

      # 类型检查：和本地一致，发现类型错就 fail
      - name: Type check
        working-directory: desktop
        shell: pwsh
        run: pnpm exec vue-tsc --noEmit

      # ============================================================
      # 渲染端 + 主进程 build（一次完成，env 全程透传）
      # 注意：vite-plugin-electron/simple 会在 electron-builder 阶段
      # 二次 build main，必须确保两次都能拿到 VITE_* env
      # ============================================================
      - name: Build renderer (Vite) + main process
        working-directory: desktop
        shell: pwsh
        env:
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
        run: pnpm run build

      # 产物改名 + electron-builder 二次 build 时也要带 env，
      # 否则 dist 里的 chunk 会带上错误的占位符
      - name: Package with electron-builder (NSIS)
        working-directory: desktop
        shell: pwsh
        env:
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Package with electron-builder (Portable)
        working-directory: desktop
        shell: pwsh
        env:
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win portable --x64 --publish never

      # 产物会落到 desktop/release/<version>/ 目录下
      - name: List release artifacts
        working-directory: desktop
        run: |
          Write-Host "=== release/ ==="
          Get-ChildItem -Path release -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      # 决定 release 用哪个 tag：
      #   - push v* 触发：tag 就是 github.ref_name（如 v0.2.1）
      #   - 手动 Run workflow：tag 取 inputs.version（用户输入）
      #   - 如果 v* push 进来但没传 version input（不应该发生，但兜底），退回 ref_name
      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "version=${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            # 去掉 ref_name 前缀 refs/tags/ 得到 v0.2.1
            $tag = "${{ github.ref_name }}".Replace("refs/tags/", "")
            "version=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 一寸光阴 ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-rc') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-alpha') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            desktop/release/TimeWell-*-x64.exe
            desktop/release/TimeWell-*-portable-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
