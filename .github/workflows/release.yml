name: Release

# 推 v* 标签触发（v1.2.3 / v0.2.1 ...）
# 工作流：装依赖 → 类型检查 → build renderer + main → electron-builder 跑 NSIS + portable → 上传到 GitHub Release
#
# 用法（本地）：
#   pnpm version patch   # bump package.json version
#   git add -A && git commit -m "release: vX.Y.Z"
#   git tag vX.Y.Z
#   git push origin main --tags
# → CI 触发本工作流，跑完自动创建 GitHub Release 并附上 .exe 资产

on:
  push:
    tags:
      - 'v*'
  # 手动触发（Actions 页面 → Run workflow），方便 CI 失败时重跑而不用删 tag
  # version 必填，例 v0.2.1（**保留 v 前缀** → release tag 也用这个）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必填，含 v 前缀，如 v0.2.1）'
        required: true
        type: string

# 写 asset 需要 contents: write
permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不用 actions/setup-node@v4 —— 它的 post-action 会嗅探 pnpm-lock.yaml 试图
      # cache pnpm，但 pnpm 还没装，结果 "Unable to locate pnpm"。
      # 改用官方 Node 安装包（来自 setup-node 内部同样的源）+ 直接装 pnpm@10。
      - name: Install Node.js 24 LTS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeVersion = '24.19.0'
          $arch = 'x64'
          $dest = "$env:ProgramFiles\nodejs"
          Write-Host "Downloading Node $nodeVersion-$arch ..."
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-$arch.zip"
          $zip = "$env:TEMP\node.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Write-Host "Extracting to $dest ..."
          Expand-Archive -Path $zip -DestinationPath $env:TEMP -Force
          if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Recurse -Force "$env:TEMP\node-v$nodeVersion-win-$arch\*" $dest
          Write-Host "Node $(node --version) at $dest"
          # 把 npm 全局目录加到 PATH（pnpm install -g 会落到这）
          $env:PATH = "$dest;$env:APPDATA\npm;$env:PATH"
          [Environment]::SetEnvironmentVariable('PATH', $env:PATH, 'User')

      - name: Install pnpm@10 globally
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:ProgramFiles\nodejs\npm.cmd" install -g pnpm@10
          $env:PATH = "$env:APPDATA\npm;$env:PATH"
          & pnpm --version

      - name: Install dependencies
        working-directory: desktop
        shell: pwsh
        run: pnpm install --frozen-lockfile || pnpm install

      # 类型检查：和本地一致，发现类型错就 fail
      - name: Type check
        working-directory: desktop
        shell: pwsh
        run: pnpm exec vue-tsc --noEmit

      # ---------- 先算版本号 + 断言，再 build（失败要快，别白跑 10 分钟打包）----------
      # 决定 release 用哪个 tag：
      #   - push v* 触发：tag 就是 github.ref_name（如 v0.2.1）
      #   - 手动 Run workflow：tag 取 inputs.version（用户输入）
      #   - 如果 v* push 进来但没传 version input（不应该发生，但兜底），退回 ref_name
      #
      # ⚠️⚠️ 不要把 `${{ ... }}` 直接插值进 pwsh 脚本源码！
      #   tag / input 的值会原样进到 `run:` 的脚本文本里，
      #   一个形如 `v1.0.0"; Write-Host pwned; #` 的 tag 就能跳出字符串执行任意命令，
      #   而这个 job 有 `contents: write`（能直接推 tag / 建 Release）。
      #   正解：值走 `env:` 传进环境变量，脚本里只读 `$env:XXX`（GitHub 官方推荐）。
      #   再加一道版本号格式校验（只允许 v<数字>.<数字>.<数字>[-后缀]），双保险。
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = "$env:DISPATCH_VERSION".Trim()
          } else {
            $version = "$env:REF_NAME".Trim()
          }
          # 只接受 vX.Y.Z（可带 -rc.1 / -beta.2 之类预发布后缀）
          if ($version -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "版本号格式非法: '$version'（只允许 v数字.数字.数字[-预发布后缀]）"
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "OK: release 版本号 = $version"

      - name: Resolve version (without 'v' prefix) for file glob
        id: pkgver
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:VERSION".Trim() -replace '^v', ''
          if ($tag -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') {
            Write-Error "包版本号格式非法: '$tag'"
            exit 1
          }
          "pkgver=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # electron-builder 按 **package.json 的 version** 命名产物，
      # 而上传用的 glob 是按 **tag** 拼的。两者不一致时：
      #   - glob 匹配不到文件 → fail_on_unmatched_files 让发版在 10 分钟后才失败
      #   - 用户端 updater 用 tag 比对版本号 → 装了版本不变的包，还无限提示"有新版本"
      - name: Assert tag matches package.json version
        working-directory: desktop
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "$env:VERSION".Trim() -replace '^v', ''
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "tag ($tag) 与 desktop/package.json version ($pkg) 不一致 —— electron-builder 会按 package.json 版本命名产物，产物名会对不上"
            exit 1
          }
          Write-Host "OK: tag 与 package.json version 一致 ($pkg)"

      # ============================================================
      # 渲染端 + 主进程 build（一次完成，env 全程透传）
      # 注意：vite-plugin-electron/simple 会在 electron-builder 阶段
      # 二次 build main，必须确保两次都能拿到 VITE_* env
      # ============================================================
      - name: Build renderer (Vite) + main process
        working-directory: desktop
        shell: pwsh
        env:
          VITE_CLOUDBASE_ENV_ID: ${{ secrets.VITE_CLOUDBASE_ENV_ID }}
          VITE_CLOUDBASE_ACCESS_KEY: ${{ secrets.VITE_CLOUDBASE_ACCESS_KEY }}
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
        run: pnpm run build

      # 构建产物里必须真的有非空 API 地址：
      # GitHub Secret 被删时 ${{ secrets.X }} 解析成空串，Vite 里 process.env
      # 会**无条件覆盖** .env 文件（空串也覆盖）→ 产物地址为空，CI 却全绿。
      # （v0.5.28 只让用户看到可读错误页，没有拦住 CI 放行）
      - name: Assert API URLs baked into bundle
        working-directory: desktop
        shell: pwsh
        env:
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VITE_AUTH_OTP_URL -or -not $env:VITE_DATA_API_URL) {
            Write-Error "GitHub Secret VITE_AUTH_OTP_URL / VITE_DATA_API_URL 为空 —— secret 被删时会解析成空串并覆盖 .env 文件，产物里的接口地址会变成空值"
            exit 1
          }
          $bundle = Get-ChildItem dist\assets\*.js -ErrorAction SilentlyContinue
          if (-not $bundle) { Write-Error "dist\assets 里没有产物 js"; exit 1 }
          foreach ($u in @($env:VITE_AUTH_OTP_URL, $env:VITE_DATA_API_URL)) {
            $hit = $bundle | Select-String -SimpleMatch -Pattern $u
            if (-not $hit) {
              Write-Error "产物里找不到 $u —— 检查 build 步骤的 env 是否透传"
              exit 1
            }
          }
          Write-Host "OK: 产物内含两个 API 地址"

      # 产物改名 + electron-builder 二次 build 时也要带 env，
      # 否则 dist 里的 chunk 会带上错误的占位符
      - name: Package with electron-builder (NSIS)
        working-directory: desktop
        shell: pwsh
        env:
          VITE_CLOUDBASE_ENV_ID: ${{ secrets.VITE_CLOUDBASE_ENV_ID }}
          VITE_CLOUDBASE_ACCESS_KEY: ${{ secrets.VITE_CLOUDBASE_ACCESS_KEY }}
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Package with electron-builder (Portable)
        working-directory: desktop
        shell: pwsh
        env:
          VITE_CLOUDBASE_ENV_ID: ${{ secrets.VITE_CLOUDBASE_ENV_ID }}
          VITE_CLOUDBASE_ACCESS_KEY: ${{ secrets.VITE_CLOUDBASE_ACCESS_KEY }}
          VITE_AUTH_OTP_URL: ${{ secrets.VITE_AUTH_OTP_URL }}
          VITE_DATA_API_URL: ${{ secrets.VITE_DATA_API_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder --win portable --x64 --publish never

      # 产物会落到 desktop/release/<version>/ 目录下
      - name: List release artifacts
        working-directory: desktop
        run: |
          Write-Host "=== release/ ==="
          Get-ChildItem -Path release -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: 一寸光阴 ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-rc') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-alpha') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # 精确列产物：NSIS .exe + blockmap（差分包）+ latest.yml（autoUpdater 必读）+ portable .exe
          # 不递归（** 会把 win-unpacked/ 里的 .exe 也匹配上）
          # 注意：portable target 不生成 blockmap / latest.yml，所以只列 portable 那个 .exe
          files: |
            desktop/release/${{ steps.pkgver.outputs.pkgver }}/TimeWell-${{ steps.pkgver.outputs.pkgver }}-x64.exe
            desktop/release/${{ steps.pkgver.outputs.pkgver }}/TimeWell-${{ steps.pkgver.outputs.pkgver }}-x64.exe.blockmap
            desktop/release/${{ steps.pkgver.outputs.pkgver }}/latest.yml
            desktop/release/${{ steps.pkgver.outputs.pkgver }}/TimeWell-${{ steps.pkgver.outputs.pkgver }}-portable-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
